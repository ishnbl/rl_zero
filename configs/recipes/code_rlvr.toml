# Adapted from the pinned current Code RL-Zero script. Not a release reproduction.
# Resource layout and episode budget are intentionally local experiment choices.
[trainer]
beta = 0.0
load_ref_policy = false
loss_fn = "dapo"
loss_denominator = "token"
clip_lower = 0.2
clip_higher = 0.272
use_rho_correction = true
async_steps = 4
num_samples_per_prompt_rollout = 8
num_unique_prompts_rollout = 32
num_mini_batches = 1
num_epochs = 1
learning_rate = 1e-6
per_device_train_batch_size = 1
kl_estimator = 2
max_prompt_token_length = 2048
response_length = 16384
pack_length = 18432
chat_template_name = "olmo_lab_code"
non_stop_penalty = false
temperature = 1.0
total_episodes = 25600
deepspeed_stage = 3
deepspeed_zpg = 1
code_pass_rate_reward_threshold = 0.0
code_apply_perf_penalty = false
code_max_execution_time = 1.0
code_api_url = "http://127.0.0.1:1234/test_program"
verification_reward = 10.0
lr_scheduler_type = "constant"
apply_verifiable_reward = true
advantage_normalization_type = "centered"
filter_zero_std_samples = true
local_eval_every = 25
eval_on_step_0 = true
save_freq = 25
checkpoint_state_freq = 25
gradient_checkpointing = true
max_grad_norm = 1.0
with_tracking = true
wandb_project = "rl-zero-lab"
wandb_entity = "local"
save_traces = true
vllm_enable_prefix_caching = true
keep_last_n_checkpoints = -1
mask_truncated_completions = true
push_to_hub = false
try_launch_beaker_eval_jobs_on_weka = false
try_auto_save_to_beaker = false
send_slack_alerts = false

[environment]
WANDB_MODE = "offline"
WANDB_ENTITY = "local"
VLLM_ALLOW_LONG_MAX_MODEL_LEN = "1"
