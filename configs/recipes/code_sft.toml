# Same prompts and reference solutions, with assistant-only loss from Open Instruct.
# Equal examples does not imply equal tokens, optimizer updates, or FLOPs to RLVR.
[trainer]
chat_template_name = "olmo_lab_code"
max_seq_length = 18432
per_device_train_batch_size = 1
gradient_accumulation_steps = 4
learning_rate = 1e-6
lr_scheduler_type = "constant"
warmup_ratio = 0.0
weight_decay = 0.0
num_train_epochs = 1
logging_steps = 1
checkpointing_steps = "25"
keep_last_n_checkpoints = 1000
clean_checkpoints_at_end = false
gradient_checkpointing = true
with_tracking = true
report_to = "wandb"
wandb_project_name = "rl-zero-lab"
wandb_entity = "local"
push_to_hub = false
try_launch_beaker_eval_jobs = false
try_auto_save_to_beaker = false

[environment]
WANDB_MODE = "offline"
WANDB_ENTITY = "local"
