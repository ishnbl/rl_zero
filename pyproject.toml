[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-zero-lab"
version = "0.1.0"
description = "Readable code-transfer and math-retention experiments with Olmo 3"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=4,<5"]
audit = ["transformers==5.4.0", "huggingface-hub==1.8.0"]
dev = ["ruff>=0.9,<1", "jinja2>=3.1,<4", "uv>=0.8,<1"]

[project.scripts]
rl-zero = "rl_zero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
